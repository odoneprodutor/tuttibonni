<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Tutti Bonni</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <meta name="description"
        content="Fale com a Tutti Bonni.">
</head>

<body>

    <!-- HEADER SECTION -->
    <header class="site-header">
        <div class="header-container">
            <div class="header-logo">
                <a href="index.html"><i>Tutti Bonni</i></a>
            </div>
            <nav class="header-nav">
                <a href="index.html">Início</a>
                <a href="products.html">Produtos</a>
                <a href="about.html">Sobre Nós</a>
                <a href="contact.html" class="active">Contato</a>
            </nav>
            <div class="header-actions">
                <a href="#cart" class="cart-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
                        <path d="M3 6h18" />
                        <path d="M16 10a4 4 0 0 1-8 0" />
                    </svg>
                </a>
                <button class="btn btn-primary btn-header">Order Now</button>
            </div>
            <button class="menu-toggle" aria-label="Abrir menu">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
        </div>
    </header>

    <section class="page-header">
        <h1 class="hero-title page-title">
            <span class="title-word-1">Fale</span>
            <span class="highlight-orange">Conosco.</span>
        </h1>
    </section>

    <section class="contact-page-content" style="max-width: 600px; margin: 0 auto; padding: 4rem 2rem;">
        <div class="product-simple-card" style="padding: 3rem; text-align: left;">
            <form class="contact-form" onsubmit="event.preventDefault(); alert('Mensagem enviada com sucesso!');">
                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; font-weight: 700; margin-bottom: 0.5rem; color: var(--on-surface-variant);">Seu Nome</label>
                    <input type="text" required style="width: 100%; padding: 12px 20px; border-radius: var(--radius-pill); border: 1px solid var(--outline); font-family: var(--font-family); font-size: 1rem; outline: none; background: rgba(255,255,255,0.8);">
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; font-weight: 700; margin-bottom: 0.5rem; color: var(--on-surface-variant);">Seu E-mail</label>
                    <input type="email" required style="width: 100%; padding: 12px 20px; border-radius: var(--radius-pill); border: 1px solid var(--outline); font-family: var(--font-family); font-size: 1rem; outline: none; background: rgba(255,255,255,0.8);">
                </div>
                <div style="margin-bottom: 2rem;">
                    <label style="display: block; font-weight: 700; margin-bottom: 0.5rem; color: var(--on-surface-variant);">Sua Mensagem</label>
                    <textarea required rows="4" style="width: 100%; padding: 12px 20px; border-radius: 20px; border: 1px solid var(--outline); font-family: var(--font-family); font-size: 1rem; outline: none; background: rgba(255,255,255,0.8); resize: none;"></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Enviar Mensagem</button>
            </form>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="minimal-footer">
        <div class="footer-logo">TUTTI BONNI</div>
        <div class="footer-links">
            <a href="#">PRIVACY</a>
            <a href="#">TERMS</a>
            <a href="#">ACCESSIBILITY</a>
            <a href="#">PRESS</a>
        </div>
        <div class="footer-copy">
            &copy; 2024 TUTTI BONNI. STAY SWEET. YOLO.
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
